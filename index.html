<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محادثة ذكية</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
:root{--bg:#0f0f14;--bg2:#16161f;--bg3:#1e1e2a;--hover:#26263a;--border:#2a2a3a;--text:#e8e8f0;--dim:#9191a8;--accent:#7c5cff;--accent2:#6b4aee;--user:#7c5cff;--bot:#1e1e2a;--danger:#ff5566;--shadow:0 4px 24px rgba(0,0,0,.4)}
body.light{--bg:#f5f5fa;--bg2:#fff;--bg3:#fff;--hover:#ececf4;--border:#e0e0ea;--text:#1a1a28;--dim:#6b6b80;--user:#6b4aee;--bot:#fff;--shadow:0 4px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'Segoe UI','Noto Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;transition:background .2s,color .2s}
.sidebar{width:260px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s,margin-right .3s;flex-shrink:0}
.sidebar.hidden{margin-right:-260px}
.sidebar-header{padding:16px}
.new-chat-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit;transition:background .2s}
.new-chat-btn:hover{background:var(--accent2)}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s}
.chat-item:hover{background:var(--hover)}.chat-item.active{background:var(--bg3)}
.chat-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chat-item-del{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;font-family:inherit}
.chat-item:hover .chat-item-del{opacity:1}.chat-item-del:hover{color:var(--danger)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer button{flex:1;padding:10px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;transition:background .15s}
.sidebar-footer button:hover{background:var(--hover)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.icon-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:8px;border-radius:8px;font-size:20px;transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.model-select{flex:1;max-width:340px;padding:8px 12px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;outline:none}
.messages{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.message{display:flex;gap:12px;max-width:820px;width:100%;margin:0 auto;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.message.user .avatar{background:var(--accent);color:#fff}
.message.assistant .avatar{background:var(--bg3);border:1px solid var(--border)}
.message-content{flex:1;min-width:0;padding:12px 16px;border-radius:12px;line-height:1.7;font-size:15px;word-wrap:break-word;overflow-wrap:break-word}
.message.user .message-content{background:var(--user);color:#fff}
.message.assistant .message-content{background:var(--bot);border:1px solid var(--border)}
.message-content p{margin:8px 0}.message-content p:first-child{margin-top:0}.message-content p:last-child{margin-bottom:0}
.message-content pre{background:#0d1117;border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left;position:relative}
.message-content code{font-family:'Fira Code',Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.message-content :not(pre)>code{background:rgba(127,127,127,.2);padding:2px 6px;border-radius:4px}
.message-content ul,.message-content ol{padding-right:24px;margin:8px 0}
.message-content a{color:var(--accent)}
.message-content blockquote{border-right:3px solid var(--accent);padding-right:12px;margin:10px 0;color:var(--dim)}
.code-copy{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;opacity:0;transition:opacity .15s;font-family:inherit}
.message-content pre:hover .code-copy{opacity:1}
.cursor::after{content:'▋';color:var(--accent);animation:blink 1s infinite;margin-right:2px}
@keyframes blink{50%{opacity:0}}
.error-banner{background:rgba(255,85,102,.1);border:1px solid var(--danger);color:var(--danger);padding:12px;border-radius:8px;font-size:14px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.empty-title{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),#ff6ec7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty-subtitle{color:var(--dim);font-size:15px;margin-bottom:32px}
.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:640px;width:100%}
.suggestion{padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:right;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,background .15s}
.suggestion:hover{border-color:var(--accent);background:var(--hover)}
.input-area{padding:16px;border-top:1px solid var(--border);background:var(--bg2)}
.input-form{max-width:820px;margin:0 auto;display:flex;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:8px;transition:border-color .15s}
.input-form:focus-within{border-color:var(--accent)}
.input-form textarea{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;outline:none;padding:8px;max-height:200px;min-height:24px;line-height:1.5}
.send-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 16px;cursor:pointer;font-size:18px;transition:background .15s,opacity .15s;flex-shrink:0}
.send-btn:hover:not(:disabled){background:var(--accent2)}.send-btn:disabled{opacity:.5;cursor:not-allowed}
.footer-note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
dialog{border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:16px;padding:24px;max-width:480px;width:calc(100% - 32px);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:16px;font-size:20px}
.dialog-field{margin-bottom:16px}
.dialog-field label{display:block;margin-bottom:6px;font-size:13px;color:var(--dim)}
.dialog-field input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:inherit;font-size:14px;outline:none;direction:ltr;text-align:left}
.dialog-field input:focus{border-color:var(--accent)}
.dialog-hint{font-size:12px;color:var(--dim);margin-top:6px}
.dialog-hint a{color:var(--accent)}
.dialog-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}
.btn{padding:10px 20px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:14px;transition:background .15s}
.btn:hover{background:var(--hover)}.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:var(--accent2)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--hover)}
@media (max-width:768px){
  .sidebar{position:fixed;top:0;right:0;bottom:0;z-index:100;box-shadow:var(--shadow)}
  .sidebar.hidden{margin-right:0;transform:translateX(100%)}
  .empty-title{font-size:22px}.messages{padding:16px 12px}
}
</style>
</head>
<body>

<aside class="sidebar hidden" id="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" id="newChatBtn"><span>＋</span> محادثة جديدة</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <button id="settingsBtn">⚙️ الإعدادات</button>
    <button id="themeBtn">🌙</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="toggleSidebar" title="القائمة">☰</button>
    <select class="model-select" id="modelSelect"></select>
  </header>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <form class="input-form" id="chatForm">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
      <button type="submit" class="send-btn" id="sendBtn">➤</button>
    </form>
    <div class="footer-note">مدعوم بـ OpenRouter عبر Cloudflare Worker</div>
  </div>
</main>

<dialog id="settingsDialog">
  <h2>⚙️ الإعدادات</h2>
  <div class="dialog-field">
    <label for="backendUrlInput">رابط الخادم الوسيط (Worker URL)</label>
    <input type="url" id="backendUrlInput" placeholder="https://your-worker.workers.dev">
    <div class="dialog-hint">الصق رابط الـ Worker الذي نشرته على Cloudflare. يبدأ عادةً بـ https://</div>
  </div>
  <div class="dialog-actions">
    <button class="btn btn-primary" id="saveSettings">حفظ</button>
    <button class="btn" id="cancelSettings">إلغاء</button>
  </div>
</dialog>

<script>
const BACKEND_URL = "https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev";

// القائمة الثابتة لم تعد مستخدمة، لكننا نبقيها فارغة للتوافق مع أي كود قديم.
const FREE_MODELS = [];
const DEFAULT_MODEL = 'openrouter/free';

const state = {
  backendUrl: localStorage.getItem('or_backend_url') || BACKEND_URL,
  model: localStorage.getItem('or_model') || DEFAULT_MODEL,
  chats: JSON.parse(localStorage.getItem('or_chats') || '[]'),
  activeChatId: localStorage.getItem('or_active_chat') || null,
  theme: localStorage.getItem('or_theme') || 'dark',
  isGenerating: false,
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const chatListEl = $('chatList');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const modelSelect = $('modelSelect');
const sidebar = $('sidebar');
const settingsDialog = $('settingsDialog');

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderMarkdown(text){
  if(typeof marked==='undefined') return escapeHtml(text).replace(/\n/g,'<br>');
  const html=marked.parse(text,{breaks:true,gfm:true});
  return typeof DOMPurify==='undefined'?html:DOMPurify.sanitize(html);
}
function saveState(){
  localStorage.setItem('or_chats',JSON.stringify(state.chats));
  localStorage.setItem('or_active_chat',state.activeChatId||'');
  localStorage.setItem('or_model',state.model);
  localStorage.setItem('or_backend_url',state.backendUrl);
  localStorage.setItem('or_theme',state.theme);
}
function getActiveChat(){return state.chats.find(c=>c.id===state.activeChatId)}
function ensureActiveChat(){
  let c=getActiveChat();
  if(!c){c={id:uid(),title:'محادثة جديدة',messages:[],createdAt:Date.now()};state.chats.unshift(c);state.activeChatId=c.id;saveState()}
  return c;
}
function applyTheme(){
  document.body.classList.toggle('light',state.theme==='light');
  $('themeBtn').textContent = state.theme==='light'?'🌞':'🌙';
}

// ============================================================
// 🆕 الدالة المعدلة: جلب النماذج المجانية ديناميكياً
// ============================================================
async function renderModelSelect() {
  modelSelect.innerHTML = '<option value="openrouter/free">تلقائي (Free Router - موصى به)</option>';

  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // تصفية النماذج التي يكون سعر الإدخال والإخراج فيها صفراً[reference:3]
    const freeModels = (data.data || []).filter(m => {
      const p = m.pricing || {};
      return String(p.prompt) === '0' && String(p.completion) === '0';
    });

    for (const m of freeModels) {
      if (m.id === 'openrouter/free') continue;
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name || m.id;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    console.warn('تعذر تحميل قائمة النماذج المجانية، سيتم استخدام openrouter/free فقط.', e);
  }

  // ضمان أن النموذج المحدد موجود في القائمة
  if (modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
    modelSelect.value = state.model;
  } else {
    modelSelect.value = 'openrouter/free';
    state.model = 'openrouter/free';
    saveState();
  }
}

function renderChatList(){
  chatListEl.innerHTML='';
  if(!state.chats.length){
    chatListEl.innerHTML='<div style="padding:16px;color:var(--dim);font-size:13px;text-align:center">لا توجد محادثات</div>';
    return;
  }
  for(const chat of state.chats){
    const item=document.createElement('div');
    item.className='chat-item'+(chat.id===state.activeChatId?' active':'');
    item.innerHTML=`<span class="chat-item-title">${escapeHtml(chat.title||'محادثة')}</span><button class="chat-item-del" title="حذف">✕</button>`;
    item.querySelector('.chat-item-title').addEventListener('click',()=>switchChat(chat.id));
    item.querySelector('.chat-item-del').addEventListener('click',(e)=>{e.stopPropagation();deleteChat(chat.id)});
    chatListEl.appendChild(item);
  }
}
function createMessageEl(role){
  const d=document.createElement('div');
  d.className='message '+role;
  d.innerHTML=`<div class="avatar">${role==='user'?'👤':'🤖'}</div><div class="message-content"></div>`;
  return d;
}
function postProcessCode(container){
  container.querySelectorAll('pre').forEach(pre=>{
    if(pre.querySelector('.code-copy')) return;
    const btn=document.createElement('button');
    btn.className='code-copy';btn.textContent='نسخ';
    btn.addEventListener('click',()=>{
      const code=pre.querySelector('code')?.innerText||pre.innerText;
      navigator.clipboard.writeText(code).then(()=>{btn.textContent='تم ✓';setTimeout(()=>btn.textContent='نسخ',1500)});
    });
    pre.appendChild(btn);
  });
  container.querySelectorAll('pre code').forEach(b=>{try{hljs.highlightElement(b)}catch(e){}});
}
function renderMessages(){
  messagesEl.innerHTML='';
  const chat=getActiveChat();
  if(!chat||!chat.messages.length){renderEmptyState();return}
  for(const msg of chat.messages){
    const el=createMessageEl(msg.role);
    const content=el.querySelector('.message-content');
    if(msg.role==='assistant'){content.innerHTML=renderMarkdown(msg.content||'');postProcessCode(content)}
    else content.textContent=msg.content;
    messagesEl.appendChild(el);
  }
  scrollToBottom();
}
function renderEmptyState(){
  messagesEl.innerHTML=`<div class="empty-state">
    <div class="empty-title">كيف يمكنني مساعدتك؟</div>
    <div class="empty-subtitle">اسأل أي شيء، من البرمجة إلى الكتابة الإبداعية</div>
    <div class="suggestions">
      <button class="suggestion" data-prompt="اشرح لي مفهوم الـ Machine Learning بمثال بسيط">🧠 اشرح لي Machine Learning</button>
      <button class="suggestion" data-prompt="اكتب لي دالة JavaScript لفرز مصفوفة من الأرقام">💻 اكتب دالة JavaScript</button>
      <button class="suggestion" data-prompt="أعطني 5 أفكار لمشاريع ويب ممتعة للمبتدئين">💡 أفكار مشاريع ويب</button>
      <button class="suggestion" data-prompt="لخص لي أهم أحداث القرن العشرين في 5 نقاط">📚 لخص القرن العشرين</button>
    </div></div>`;
  messagesEl.querySelectorAll('.suggestion').forEach(b=>{
    b.addEventListener('click',()=>{inputEl.value=b.dataset.prompt;handleSend()});
  });
}
function scrollToBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}
function newChat(){
  const chat={id:uid(),title:'محادثة جديدة',messages:[],createdAt:Date.now()};
  state.chats.unshift(chat);state.activeChatId=chat.id;saveState();
  renderChatList();renderMessages();
  if(window.innerWidth<=768) sidebar.classList.add('hidden');
  inputEl.focus();
}
function switchChat(id){
  state.activeChatId=id;saveState();renderChatList();renderMessages();
  if(window.innerWidth<=768) sidebar.classList.add('hidden');
}
function deleteChat(id){
  if(!confirm('حذف هذه المحادثة؟')) return;
  state.chats=state.chats.filter(c=>c.id!==id);
  if(state.activeChatId===id) state.activeChatId=state.chats[0]?.id||null;
  saveState();renderChatList();renderMessages();
}

async function handleSend(){
  const text=inputEl.value.trim();
  if(!text||state.isGenerating) return;
  if(!state.backendUrl){openSettings();return}

  const chat=ensureActiveChat();
  inputEl.value='';autoResize();
  state.isGenerating=true;sendBtn.disabled=true;

  chat.messages.push({role:'user',content:text});
  if(chat.messages.length===1) chat.title=text.slice(0,40)+(text.length>40?'…':'');
  saveState();

  messagesEl.innerHTML='';
  for(const msg of chat.messages){
    const el=createMessageEl(msg.role);
    const content=el.querySelector('.message-content');
    if(msg.role==='assistant'){content.innerHTML=renderMarkdown(msg.content||'');postProcessCode(content)}
    else content.textContent=msg.content;
    messagesEl.appendChild(el);
  }

  const assistantEl=createMessageEl('assistant');
  const assistantContent=assistantEl.querySelector('.message-content');
  assistantContent.classList.add('cursor');
  messagesEl.appendChild(assistantEl);
  scrollToBottom();

  const apiMessages=[
    {role:'system',content:'أنت مساعد ذكي ومفيد. أجب بلغة المستخدم، وكن دقيقاً وواضحاً. استخدم Markdown عند الحاجة.'},
    ...chat.messages.map(m=>({role:m.role,content:m.content}))
  ];

  let fullResponse='';

  try{
    const response=await fetch(state.backendUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:state.model,messages:apiMessages,stream:true}),
    });

    if(!response.ok){
      const errText=await response.text();
      let errMsg=`HTTP ${response.status}`;
      try{const j=JSON.parse(errText);errMsg=j.error?.message||j.message||errMsg}
      catch(e){
        if(errText.startsWith('<')){
          errMsg=`الخادم الوسيط أعاد صفحة HTML بدلاً من JSON (HTTP ${response.status}). تحقق من صحة رابط الـ Worker وأنه منشور.`;
        }
      }
      throw new Error(errMsg);
    }

    if(!response.body) throw new Error('المتصفح لا يدعم Streaming. استخدم Chrome/Edge حديثاً.');

    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    let firstChunk=true;

    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';
      for(const line of lines){
        const t=line.trim();
        if(!t.startsWith('data:')) continue;
        const data=t.slice(5).trim();
        if(data==='[DONE]') continue;
        try{
          const json=JSON.parse(data);
          const delta=json.choices?.[0]?.delta?.content;
          if(delta){
            if(firstChunk){assistantContent.classList.remove('cursor');firstChunk=false}
            fullResponse+=delta;
            assistantContent.innerHTML=renderMarkdown(fullResponse);
            scrollToBottom();
          }
        }catch(e){}
      }
    }

    assistantContent.classList.remove('cursor');
    assistantContent.innerHTML=renderMarkdown(fullResponse);
    postProcessCode(assistantContent);
    chat.messages.push({role:'assistant',content:fullResponse});
    saveState();renderChatList();

  }catch(err){
    assistantContent.classList.remove('cursor');
    assistantContent.innerHTML='';
    const b=document.createElement('div');
    b.className='error-banner';
    b.textContent='⚠️ '+err.message;
    assistantContent.appendChild(b);
  }finally{
    state.isGenerating=false;sendBtn.disabled=false;inputEl.focus();scrollToBottom();
  }
}

function openSettings(){$('backendUrlInput').value=state.backendUrl;settingsDialog.showModal()}
function saveSettings(){
  let url=$('backendUrlInput').value.trim();
  if(url && !url.startsWith('http')) url='https://'+url;
  state.backendUrl=url;saveState();settingsDialog.close();
  if(state.backendUrl && getActiveChat()?.messages.length===0) renderMessages();
}
function autoResize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px'}

async function init(){
  applyTheme();
  await renderModelSelect(); // انتظر تحميل النماذج المجانية
  renderChatList();
  if(!state.activeChatId && state.chats.length) state.activeChatId=state.chats[0].id;
  renderMessages();

  $('newChatBtn').addEventListener('click',newChat);
  $('settingsBtn').addEventListener('click',openSettings);
  $('saveSettings').addEventListener('click',saveSettings);
  $('cancelSettings').addEventListener('click',()=>settingsDialog.close());
  $('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme();saveState()});
  $('toggleSidebar').addEventListener('click',()=>sidebar.classList.toggle('hidden'));
  modelSelect.addEventListener('change',()=>{state.model=modelSelect.value;saveState()});
  $('chatForm').addEventListener('submit',(e)=>{e.preventDefault();handleSend()});
  inputEl.addEventListener('input',autoResize);
  inputEl.addEventListener('keydown',(e)=>{
    if(e.key==='Enter' && !e.shiftKey){e.preventDefault();handleSend()}
  });

  if(window.innerWidth>768) sidebar.classList.remove('hidden');
  if(!state.backendUrl) setTimeout(openSettings,400);
  inputEl.focus();
}
init();
</script>
</body>
</html>
