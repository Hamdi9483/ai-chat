<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد المحاسبي والمخزني - ERP</title>
  <style>
    :root[data-theme="light"] {
      --bg-canvas: #eceff1;
      --bg-surface: #f8fafc;
      --bg-elevated: #ffffff;
      --bg-subtle: #e2e8f0;
      --bg-user: #d1d5db;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --border-color: #cbd5e1;
      --accent: #374151;
      --accent-hover: #111827;
      --accent-text: #ffffff;
      --success-bg: #e5e7eb;
      --success-border: #374151;
      --success-text: #111827;
      --error-bg: #f3f4f6;
      --error-border: #6b7280;
      --error-text: #1f2937;
      --shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
    }

    :root[data-theme="dark"] {
      --bg-canvas: #121417;
      --bg-surface: #1b1e23;
      --bg-elevated: #242830;
      --bg-subtle: #2f3540;
      --bg-user: #373d49;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
      --accent: #d1d5db;
      --accent-hover: #ffffff;
      --accent-text: #111827;
      --success-bg: #262b34;
      --success-border: #9ca3af;
      --success-text: #f9fafb;
      --error-bg: #22252b;
      --error-border: #6b7280;
      --error-text: #e5e7eb;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.65;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .top-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .worker-row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .worker-row label {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .worker-row input {
      flex: 1;
      min-width: 240px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.88rem;
      direction: ltr;
      text-align: left;
    }

    .chat-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      min-height: 360px;
      max-height: 60vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .bubble.user {
      background: var(--bg-user);
      align-self: flex-start;
      max-width: 90%;
    }

    .bubble.assistant {
      background: var(--bg-surface);
      align-self: stretch;
    }

    .bubble-text {
      white-space: pre-line;
      font-size: 0.95rem;
    }

    .card-box {
      margin-top: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
    }

    .card-title {
      font-weight: 700;
      font-size: 0.98rem;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .summary-list {
      margin: 6px 0 12px;
      padding-right: 20px;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .summary-list li {
      margin-bottom: 4px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field input,
    .field select,
    .field textarea {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .edit-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid transparent;
      transition: 0.15s ease;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-ghost {
      background: var(--bg-subtle);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      border: 1px solid;
    }

    .banner.ok {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .banner.err {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .composer {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      box-shadow: var(--shadow);
    }

    .composer textarea {
      flex: 1;
      min-height: 52px;
      max-height: 150px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-card">
      <div class="top-row">
        <div class="brand">
          <h1>المساعد المحاسبي والمخزني</h1>
          <p>إدخال طبيعي للقيود والفواتير والحركات المخزنية مع التحقق والتنفيذ</p>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-ghost" id="themeToggleBtn">الوضع الليلي</button>
          <button type="button" class="btn-ghost" id="refreshCtxBtn">تحديث البيانات</button>
        </div>
      </div>

      <div class="worker-row">
        <label for="workerUrl">رابط Cloudflare Worker:</label>
        <input
          type="text"
          id="workerUrl"
          placeholder="https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev"
        />
      </div>
    </header>

    <main class="chat-panel" id="chatPanel">
      <div class="bubble assistant">
        <div class="bubble-text">
          أهلاً بك. اكتب العملية المحاسبية أو المخزنية أو الفاتورة بلغة عادية؛ سأطرح سؤالاً إذا كانت هناك بيانات ناقصة، أو أعرض لك ملخص العملية مع أزرار التعديل والتنفيذ.
        </div>
      </div>
    </main>

    <form class="composer" id="composerForm">
      <textarea
        id="userInput"
        placeholder="اكتب طلبك هنا... مثال: اشترينا 100 قطعة بسعر 10 ليرات من مورد الأمل على الحساب للمستودع الرئيسي"
        required
      ></textarea>
      <button type="submit" class="btn-primary" id="sendBtn">إرسال</button>
    </form>
  </div>

  <script>
    const THEME_KEY = "erp_ui_theme_v1";
    const WORKER_KEY = "erp_worker_url_v1";
    const DEFAULT_WORKER_URL = "https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev";

    let erpContext = {
      accounts: [],
      warehouses: [],
      items: [],
      item_units: [],
      stock_balances: [],
      rates: [],
    };

    const htmlRoot = document.documentElement;
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const refreshCtxBtn = document.getElementById("refreshCtxBtn");
    const workerUrlInput = document.getElementById("workerUrl");
    const chatPanel = document.getElementById("chatPanel");
    const composerForm = document.getElementById("composerForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function applyTheme(theme) {
      const mode = theme === "dark" ? "dark" : "light";
      htmlRoot.setAttribute("data-theme", mode);
      localStorage.setItem(THEME_KEY, mode);
      themeToggleBtn.textContent = mode === "dark" ? "الوضع النهاري" : "الوضع الليلي";
    }

    themeToggleBtn.addEventListener("click", () => {
      const current = htmlRoot.getAttribute("data-theme");
      applyTheme(current === "dark" ? "light" : "dark");
    });

    applyTheme(localStorage.getItem(THEME_KEY) || "light");

    workerUrlInput.value = localStorage.getItem(WORKER_KEY) || DEFAULT_WORKER_URL;
    workerUrlInput.addEventListener("change", () => {
      localStorage.setItem(WORKER_KEY, workerUrlInput.value.trim());
      loadContext();
    });

    refreshCtxBtn.addEventListener("click", () => loadContext(true));

    function getWorkerUrl() {
      const raw = (workerUrlInput.value || "").trim().replace(/\/+$/, "");
      if (!raw) throw new Error("يرجى إدخال رابط Cloudflare Worker.");
      localStorage.setItem(WORKER_KEY, raw);
      return raw;
    }

    function sanitizeReply(text) {
      if (!text) return "";
      return text
        .replace(/```json[\s\S]*?```/gi, "")
        .replace(/```[\s\S]*?```/g, "")
        .replace(/\{[\s\S]*"proposal_type"[\s\S]*\}/g, "")
        .trim();
    }

    function addBanner(text, ok) {
      const el = document.createElement("div");
      el.className = `banner ${ok ? "ok" : "err"}`;
      el.textContent = text;
      chatPanel.appendChild(el);
      chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    function addUserBubble(text) {
      const el = document.createElement("div");
      el.className = "bubble user";
      const body = document.createElement("div");
      body.className = "bubble-text";
      body.textContent = text;
      el.appendChild(body);
      chatPanel.appendChild(el);
      chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    async function loadContext(notify = false) {
      try {
        const base = getWorkerUrl();
        const res = await fetch(`${base}/api/context`);
        const data = await res.json();
        if (res.ok && data.ok && data.context) {
          erpContext = data.context;
          if (notify) addBanner("تم تحديث البيانات بنجاح.", true);
        }
      } catch (err) {
        if (notify) addBanner(err.message || "تعذر تحديث البيانات.", false);
      }
    }

    async function sendPrompt(text, baseContextText = "") {
      const clean = (text || "").trim();
      if (!clean) return;

      const combinedPrompt = baseContextText
        ? `${baseContextText}\nاستكمال وتوضيح: ${clean}`
        : clean;

      addUserBubble(clean);
      sendBtn.disabled = true;

      const pending = document.createElement("div");
      pending.className = "bubble assistant";
      pending.innerHTML = `<div class="bubble-text">جاري المعالجة...</div>`;
      chatPanel.appendChild(pending);
      chatPanel.scrollTop = chatPanel.scrollHeight;

      try {
        const base = getWorkerUrl();
        const res = await fetch(`${base}/api/interpret`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: combinedPrompt }),
        });
        const data = await res.json();
        pending.remove();

        if (!res.ok || !data.ok) {
          addBanner(data.error || "حدث خطأ أثناء المعالجة.", false);
          return;
        }

        renderAssistant(data.reply, data.proposal, combinedPrompt);
      } catch (err) {
        pending.remove();
        addBanner(err.message || "تعذر الاتصال بالخادم.", false);
      } finally {
        sendBtn.disabled = false;
      }
    }

    function renderAssistant(rawReply, proposal, sourcePrompt) {
      const bubble = document.createElement("div");
      bubble.className = "bubble assistant";

      const visibleText = sanitizeReply(rawReply);
      const textDiv = document.createElement("div");
      textDiv.className = "bubble-text";
      textDiv.textContent =
        visibleText ||
        (proposal?.proposal_type === "missing_info"
          ? proposal.question || "يرجى إكمال البيانات الناقصة."
          : "تم تجهيز ملخص العملية.");
      bubble.appendChild(textDiv);

      if (proposal && proposal.proposal_type === "missing_info") {
        bubble.appendChild(buildMissingCard(proposal, sourcePrompt));
      } else if (proposal && proposal.payload) {
        bubble.appendChild(buildProposalCard(proposal, sourcePrompt));
      }

      chatPanel.appendChild(bubble);
      chatPanel.scrollTop = chatPanel.scrollHeight;
    }

    function buildMissingCard(proposal, sourcePrompt) {
      const box = document.createElement("div");
      box.className = "card-box";

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = "إكمال البيانات الناقصة";
      box.appendChild(title);

      const fields =
        Array.isArray(proposal.missing_fields) && proposal.missing_fields.length > 0
          ? proposal.missing_fields
          : [{ key: "details", label: "البيانات المطلوبة", type: "text" }];

      const grid = document.createElement("div");
      grid.className = "form-grid";
      const map = {};

      fields.forEach((f) => {
        const wrap = document.createElement("div");
        wrap.className = "field";

        const lbl = document.createElement("label");
        lbl.textContent = f.label || f.key;
        wrap.appendChild(lbl);

        const inp = document.createElement("input");
        inp.type = f.type === "number" ? "number" : "text";
        if (inp.type === "number") inp.step = "any";
        map[f.key] = inp;
        wrap.appendChild(inp);
        grid.appendChild(wrap);
      });

      box.appendChild(grid);

      const row = document.createElement("div");
      row.className = "btn-row";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn-primary";
      btn.textContent = "متابعة";
      btn.onclick = () => {
        const chunks = [];
        fields.forEach((f) => {
          const val = (map[f.key]?.value || "").trim();
          if (val) chunks.push(`${f.label || f.key}: ${val}`);
        });
        if (!chunks.length) {
          addBanner("يرجى إدخال قيمة واحدة على الأقل.", false);
          return;
        }
        sendPrompt(chunks.join(" ، "), sourcePrompt);
      };

      row.appendChild(btn);
      box.appendChild(row);
      return box;
    }

    function buildProposalCard(proposal, sourcePrompt) {
      const box = document.createElement("div");
      box.className = "card-box";

      const labels = {
        invoice: "فاتورة",
        journal_entry: "قيد يومي",
        stock_movement: "حركة مخزنية",
        void_record: "إبطال سجل",
      };

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = `${proposal.title || "عملية مقترحة"} — ${labels[proposal.proposal_type] || proposal.proposal_type}`;
      box.appendChild(title);

      box.appendChild(buildSummaryList(proposal));

      const editBox = document.createElement("div");
      editBox.className = "edit-box";
      editBox.style.display = "none";

      const row = document.createElement("div");
      row.className = "btn-row";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "btn-ghost";
      editBtn.textContent = "تعديل";

      const execBtn = document.createElement("button");
      execBtn.type = "button";
      execBtn.className = "btn-primary";
      execBtn.textContent = proposal.button_label || "تنفيذ العملية";

      editBtn.onclick = () => {
        if (editBox.style.display === "none") {
          renderEditBox(editBox, proposal, sourcePrompt, () => {
            box.replaceWith(buildProposalCard(proposal, sourcePrompt));
          });
          editBox.style.display = "block";
        } else {
          editBox.style.display = "none";
        }
      };

      execBtn.onclick = async () => {
        execBtn.disabled = true;
        editBtn.disabled = true;
        try {
          const base = getWorkerUrl();
          const res = await fetch(`${base}/api/execute-proposal`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proposal }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            addBanner(data.error || "فشل التنفيذ.", false);
            execBtn.disabled = false;
            editBtn.disabled = false;
            return;
          }
          addBanner("تم تنفيذ العملية وترحيلها بنجاح.", true);
          execBtn.textContent = "تم التنفيذ";
        } catch (err) {
          addBanner(err.message || "حدث خطأ أثناء التنفيذ.", false);
          execBtn.disabled = false;
          editBtn.disabled = false;
        }
      };

      row.appendChild(editBtn);
      row.appendChild(execBtn);
      box.appendChild(row);
      box.appendChild(editBox);
      return box;
    }

    function buildSummaryList(proposal) {
      const ul = document.createElement("ul");
      ul.className = "summary-list";
      const p = proposal.payload || {};

      const addRow = (k, v) => {
        if (v === undefined || v === null || v === "") return;
        const li = document.createElement("li");
        const strong = document.createElement("strong");
        strong.textContent = `${k}: `;
        li.appendChild(strong);
        li.appendChild(document.createTextNode(String(v)));
        ul.appendChild(li);
      };

      if (proposal.proposal_type === "invoice") {
        addRow("النوع", p.invoice_type === "sale" ? "مبيعات" : "مشتريات");
        addRow("التاريخ", p.invoice_date);
        addRow("المستودع", p.warehouse_code);
        addRow("الطرف", p.party_name);
        addRow("حساب التسوية", p.settlement_account_code);
        addRow("الحساب المقابل", p.offset_account_code);
        addRow("العملة", p.currency);
        if (Array.isArray(p.lines)) {
          let sum = 0;
          p.lines.forEach((l, i) => {
            const qty = Number(l.quantity || 0);
            const prc = Number(l.unit_price ?? l.unit_cost ?? 0);
            sum += qty * prc;
            addRow(`السطر ${i + 1}`, `صنف ${l.item_code} | كمية ${qty} ${l.unit_name || ""} × ${prc} = ${qty * prc}`);
          });
          const net =
            sum -
            Number(p.discount_amount || 0) +
            Number(p.tax_amount || 0) +
            Number(p.extra_expenses || 0);
          addRow("الإجمالي", `${net} ${p.currency || ""}`);
        }
      } else if (proposal.proposal_type === "journal_entry") {
        addRow("التاريخ", p.entry_date);
        addRow("البيان", p.description);
        addRow("العملة", p.currency);
        if (Array.isArray(p.lines)) {
          p.lines.forEach((l, i) => {
            addRow(`سطر ${i + 1}`, `حساب ${l.account_code} | مدين: ${Number(l.debit || 0)} | دائن: ${Number(l.credit || 0)}`);
          });
        }
      } else if (proposal.proposal_type === "stock_movement") {
        addRow("النوع", p.movement_type === "IN" ? "إدخال" : "إخراج");
        addRow("التاريخ", p.movement_date);
        addRow("المستودع", p.warehouse_code);
        addRow("السبب", p.reason);
        if (Array.isArray(p.lines)) {
          p.lines.forEach((l, i) => {
            addRow(`سطر ${i + 1}`, `صنف ${l.item_code} | كمية ${l.quantity} ${l.unit_name || ""}`);
          });
        }
      } else if (proposal.proposal_type === "void_record") {
        addRow("نوع السجل", p.entity_type);
        addRow("رقم السجل", p.record_id);
        addRow("السبب", p.void_reason);
      }

      return ul;
    }

    function renderEditBox(box, proposal, sourcePrompt, onUpdated) {
      box.innerHTML = "";
      const p = proposal.payload || {};

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = "تعديل البيانات";
      box.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "form-grid";

      const keys = Object.keys(p).filter((k) => typeof p[k] !== "object" || p[k] === null);
      const inputs = {};

      keys.forEach((k) => {
        const wrap = document.createElement("div");
        wrap.className = "field";

        const lbl = document.createElement("label");
        lbl.textContent = k;
        wrap.appendChild(lbl);

        const inp = document.createElement("input");
        inp.type = typeof p[k] === "number" ? "number" : "text";
        if (inp.type === "number") inp.step = "any";
        inp.value = p[k] ?? "";
        inputs[k] = inp;
        wrap.appendChild(inp);
        grid.appendChild(wrap);
      });

      box.appendChild(grid);

      const noteWrap = document.createElement("div");
      noteWrap.className = "field";
      noteWrap.style.marginTop = "10px";

      const noteLbl = document.createElement("label");
      noteLbl.textContent = "أو اكتب تعديلك بكلمات بسيطة ليعيد المساعد صياغته:";
      noteWrap.appendChild(noteLbl);

      const noteInp = document.createElement("input");
      noteInp.type = "text";
      noteInp.placeholder = "مثال: غيّر الكمية إلى 50 أو اجعل الحساب الصندوق";
      noteWrap.appendChild(noteInp);
      box.appendChild(noteWrap);

      const row = document.createElement("div");
      row.className = "btn-row";

      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "btn-primary";
      saveBtn.textContent = "حفظ التعديل";
      saveBtn.onclick = () => {
        keys.forEach((k) => {
          const val = inputs[k].value;
          if (val === "") p[k] = null;
          else if (typeof p[k] === "number") p[k] = Number(val);
          else p[k] = val;
        });
        onUpdated();
      };

      const askBtn = document.createElement("button");
      askBtn.type = "button";
      askBtn.className = "btn-ghost";
      askBtn.textContent = "إعادة الصياغة بالمساعد";
      askBtn.onclick = () => {
        const txt = noteInp.value.trim();
        if (!txt) {
          addBanner("اكتب ملاحظة التعديل أولاً.", false);
          return;
        }
        sendPrompt(`تعديل: ${txt}`, sourcePrompt);
      };

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "btn-ghost";
      closeBtn.textContent = "إغلاق";
      closeBtn.onclick = () => {
        box.style.display = "none";
      };

      row.appendChild(saveBtn);
      row.appendChild(askBtn);
      row.appendChild(closeBtn);
      box.appendChild(row);
    }

    composerForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;
      userInput.value = "";
      sendPrompt(val);
    });

    if (workerUrlInput.value.trim()) {
      loadContext();
    }
  </script>
</body>
</html>
