<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مساعد المحاسبة والمخزون - ERP</title>
  <style>
    :root[data-theme="light"] {
      --bg-app: #e5e7eb;
      --bg-shell: #f9fafb;
      --bg-card: #ffffff;
      --bg-soft: #f3f4f6;
      --bg-user: #374151;
      --text-user: #ffffff;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --border: #d1d5db;
      --btn-bg: #1f2937;
      --btn-hover: #111827;
      --btn-fg: #ffffff;
      --pill-bg: #e5e7eb;
      --pill-hover: #d1d5db;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
    }

    :root[data-theme="dark"] {
      --bg-app: #0f1115;
      --bg-shell: #171a20;
      --bg-card: #20242c;
      --bg-soft: #2a2f3a;
      --bg-user: #4b5563;
      --text-user: #ffffff;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border: #374151;
      --btn-bg: #e5e7eb;
      --btn-hover: #ffffff;
      --btn-fg: #111827;
      --pill-bg: #2a2f3a;
      --pill-hover: #374151;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 12px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .shell {
      width: 100%;
      max-width: 920px;
      background: var(--bg-shell);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 36px);
      min-height: 540px;
    }

    .topbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #374151;
      box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.25);
    }

    :root[data-theme="dark"] .status-dot.online {
      background: #d1d5db;
    }

    .brand-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .worker-strip {
      background: var(--bg-soft);
      border-bottom: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .worker-strip input {
      flex: 1;
      min-width: 240px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.84rem;
      direction: ltr;
      text-align: left;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-row.user {
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-items: flex-start;
      width: 100%;
    }

    .meta {
      font-size: 0.76rem;
      color: var(--text-secondary);
      padding: 0 4px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      line-height: 1.65;
      font-size: 0.94rem;
      white-space: pre-line;
    }

    .msg-row.user .bubble {
      background: var(--bg-user);
      color: var(--text-user);
      border-color: transparent;
      max-width: 82%;
      border-bottom-left-radius: 4px;
    }

    .msg-row.assistant .bubble {
      background: var(--bg-card);
      color: var(--text-primary);
      width: 100%;
      border-bottom-right-radius: 4px;
    }

    .card {
      margin-top: 10px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .card-head {
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .summary {
      margin: 6px 0 12px;
      padding-right: 18px;
      font-size: 0.89rem;
    }

    .summary li {
      margin-bottom: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .field input,
    .field select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.88rem;
    }

    .edit-area {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid transparent;
      transition: 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--btn-hover);
    }

    .btn-soft {
      background: var(--pill-bg);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-soft:hover:not(:disabled) {
      background: var(--pill-hover);
    }

    .notice {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.86rem;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .quick-prompts {
      padding: 8px 18px 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--bg-shell);
    }

    .quick-chip {
      font-size: 0.78rem;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .quick-chip:hover:not(:disabled) {
      background: var(--pill-hover);
      color: var(--text-primary);
    }

    .composer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 12px 18px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .composer textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.93rem;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand-wrap">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <h1 class="brand-title">المساعد المحاسبي والمخزني</h1>
          <p class="brand-sub" id="statusText">جاهز لاستقبال أوامرك</p>
        </div>
      </div>

      <div class="topbar-controls">
        <button type="button" class="btn-soft" id="themeBtn">الوضع الليلي</button>
        <button type="button" class="btn-soft" id="syncBtn">مزامنة القاعدة</button>
      </div>
    </div>

    <div class="worker-strip">
      <label for="workerInput">رابط Worker:</label>
      <input
        type="text"
        id="workerInput"
        placeholder="https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev"
      />
    </div>

    <div class="messages" id="messages">
      <div class="msg-row assistant">
        <div class="meta">المساعد الذكي</div>
        <div class="bubble">أهلاً بك. اكتب العملية المحاسبية أو المخزنية أو الفاتورة بلغة عادية؛ سأسألك عن أي معلومة ناقصة، أو أعرض لك ملخص العملية مع أزرار التعديل والتنفيذ.</div>
      </div>
    </div>

    <div class="quick-prompts">
      <button type="button" class="quick-chip" data-sample="سددنا 50000 من الصندوق لحساب الموردين">سداد لمورد من الصندوق</button>
      <button type="button" class="quick-chip" data-sample="اشترينا 20 قطعة من المستودع الرئيسي">مثال فاتورة مشتريات</button>
      <button type="button" class="quick-chip" data-sample="إخراج مخزني لـ 5 قطع من المستودع الرئيسي">مثال إخراج مخزني</button>
    </div>

    <form class="composer" id="composer">
      <textarea
        id="promptBox"
        placeholder="اكتب طلبك هنا... واضغط Enter للإرسال (Shift+Enter لسطر جديد)"
        required
      ></textarea>
      <button type="submit" class="btn-primary" id="sendBtn">إرسال</button>
    </form>
  </div>

  <script>
    const THEME_STORAGE = "erp_theme_pref";
    const WORKER_STORAGE = "erp_worker_endpoint";
    const DEFAULT_WORKER = "https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev";

    let erpData = {
      accounts: [],
      warehouses: [],
      items: [],
      item_units: [],
      stock_balances: [],
      rates: [],
    };

    const rootEl = document.documentElement;
    const themeBtn = document.getElementById("themeBtn");
    const syncBtn = document.getElementById("syncBtn");
    const workerInput = document.getElementById("workerInput");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const messagesEl = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const promptBox = document.getElementById("promptBox");
    const sendBtn = document.getElementById("sendBtn");

    function setTheme(mode) {
      const target = mode === "dark" ? "dark" : "light";
      rootEl.setAttribute("data-theme", target);
      localStorage.setItem(THEME_STORAGE, target);
      themeBtn.textContent = target === "dark" ? "الوضع النهاري" : "الوضع الليلي";
    }

    themeBtn.addEventListener("click", () => {
      setTheme(rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    setTheme(localStorage.getItem(THEME_STORAGE) || "light");

    workerInput.value = localStorage.getItem(WORKER_STORAGE) || DEFAULT_WORKER;
    workerInput.addEventListener("change", () => {
      localStorage.setItem(WORKER_STORAGE, workerInput.value.trim());
      syncContext();
    });

    syncBtn.addEventListener("click", () => syncContext(true));

    document.querySelectorAll(".quick-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const sample = chip.getAttribute("data-sample") || "";
        if (sample) sendMessage(sample);
      });
    });

    promptBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const text = promptBox.value.trim();
        if (text) {
          promptBox.value = "";
          sendMessage(text);
        }
      }
    });

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = promptBox.value.trim();
      if (!text) return;
      promptBox.value = "";
      sendMessage(text);
    });

    function getWorkerEndpoint() {
      const val = (workerInput.value || "").trim().replace(/\/+$/, "");
      if (!val) throw new Error("يرجى إدخال رابط Cloudflare Worker.");
      localStorage.setItem(WORKER_STORAGE, val);
      return val;
    }

    function cleanDisplayText(text) {
      if (!text) return "";
      return text
        .replace(/```json[\s\S]*?```/gi, "")
        .replace(/```[\s\S]*?```/g, "")
        .replace(/\{[\s\S]*"proposal_type"[\s\S]*\}/g, "")
        .trim();
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addNotice(text) {
      const div = document.createElement("div");
      div.className = "notice";
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollBottom();
    }

    function addUserBubble(text) {
      const row = document.createElement("div");
      row.className = "msg-row user";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "أنت";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(meta);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollBottom();
    }

    async function syncContext(showToast = false) {
      try {
        const endpoint = getWorkerEndpoint();
        const res = await fetch(`${endpoint}/api/context`);
        const data = await res.json();
        if (res.ok && data.ok && data.context) {
          erpData = data.context;
          statusDot.classList.add("online");
          statusText.textContent = `متصل (${erpData.accounts.length} حساب نشط)`;
          if (showToast) addNotice("تمت مزامنة البيانات المرجعية بنجاح.");
        } else {
          statusDot.classList.remove("online");
          statusText.textContent = "تعذر الاتصال بالخادم";
          if (showToast) addNotice(data.error || "تعذر مزامنة البيانات.");
        }
      } catch (err) {
        statusDot.classList.remove("online");
        statusText.textContent = "غير متصل";
        if (showToast) addNotice(err.message || "تعذر الاتصال.");
      }
    }

    async function sendMessage(text, previousContextText = "") {
      const clean = (text || "").trim();
      if (!clean) return;

      const fullPrompt = previousContextText
        ? `${previousContextText}\nتوضيح وإكمال: ${clean}`
        : clean;

      addUserBubble(clean);
      sendBtn.disabled = true;

      const typingRow = document.createElement("div");
      typingRow.className = "msg-row assistant";
      typingRow.innerHTML = `<div class="meta">المساعد الذكي</div><div class="bubble">جاري التفكير وتجهيز الرد...</div>`;
      messagesEl.appendChild(typingRow);
      scrollBottom();

      try {
        const endpoint = getWorkerEndpoint();
        const res = await fetch(`${endpoint}/api/interpret`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: fullPrompt }),
        });

        const data = await res.json();
        typingRow.remove();

        if (!res.ok || !data.ok) {
          addNotice(data.error || "حدث خطأ أثناء معالجة الطلب.");
          return;
        }

        renderAssistantBubble(data.reply, data.proposal, fullPrompt);
      } catch (err) {
        typingRow.remove();
        addNotice(err.message || "تعذر الاتصال بالخادم.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function renderAssistantBubble(rawReply, proposal, sourcePrompt) {
      const row = document.createElement("div");
      row.className = "msg-row assistant";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "المساعد الذكي";
      row.appendChild(meta);

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const cleanText = cleanDisplayText(rawReply);
      const textPart = document.createElement("div");
      textPart.textContent =
        cleanText ||
        (proposal?.proposal_type === "missing_info"
          ? proposal.question || "يرجى تزويدي بالبيانات الناقصة."
          : "تم تجهيز ملخص العملية.");
      bubble.appendChild(textPart);

      if (proposal && proposal.proposal_type === "missing_info") {
        bubble.appendChild(createMissingFieldsCard(proposal, sourcePrompt));
      } else if (proposal && proposal.payload) {
        bubble.appendChild(createActionCard(proposal, sourcePrompt));
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollBottom();
    }

    function createMissingFieldsCard(proposal, sourcePrompt) {
      const card = document.createElement("div");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      head.textContent = "إكمال البيانات الناقصة";
      card.appendChild(head);

      const fields =
        Array.isArray(proposal.missing_fields) && proposal.missing_fields.length > 0
          ? proposal.missing_fields
          : [{ key: "details", label: "البيانات المطلوبة", type: "text" }];

      const grid = document.createElement("div");
      grid.className = "grid";
      const inputMap = {};

      fields.forEach((f) => {
        const wrap = document.createElement("div");
        wrap.className = "field";

        const lbl = document.createElement("label");
        lbl.textContent = f.label || f.key;
        wrap.appendChild(lbl);

        const inp = document.createElement("input");
        inp.type = f.type === "number" ? "number" : "text";
        if (inp.type === "number") inp.step = "any";
        inputMap[f.key] = inp;
        wrap.appendChild(inp);
        grid.appendChild(wrap);
      });

      card.appendChild(grid);

      const actions = document.createElement("div");
      actions.className = "actions";

      const goBtn = document.createElement("button");
      goBtn.type = "button";
      goBtn.className = "btn-primary";
      goBtn.textContent = "إرسال البيانات";
      goBtn.onclick = () => {
        const pieces = [];
        fields.forEach((f) => {
          const val = (inputMap[f.key]?.value || "").trim();
          if (val) pieces.push(`${f.label || f.key}: ${val}`);
        });
        if (!pieces.length) {
          addNotice("يرجى إدخال قيمة واحدة على الأقل.");
          return;
        }
        sendMessage(pieces.join(" ، "), sourcePrompt);
      };

      actions.appendChild(goBtn);
      card.appendChild(actions);
      return card;
    }

    function createActionCard(proposal, sourcePrompt) {
      const card = document.createElement("div");
      card.className = "card";

      const typeMap = {
        invoice: "فاتورة",
        journal_entry: "قيد يومي",
        stock_movement: "حركة مخزنية",
        void_record: "إبطال سجل",
      };

      const head = document.createElement("div");
      head.className = "card-head";
      head.textContent = `${proposal.title || "عملية جاهزة"} (${typeMap[proposal.proposal_type] || proposal.proposal_type})`;
      card.appendChild(head);

      card.appendChild(buildSummary(proposal));

      const editArea = document.createElement("div");
      editArea.className = "edit-area";
      editArea.style.display = "none";

      const actions = document.createElement("div");
      actions.className = "actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "btn-soft";
      editBtn.textContent = "تعديل";

      const execBtn = document.createElement("button");
      execBtn.type = "button";
      execBtn.className = "btn-primary";
      execBtn.textContent = proposal.button_label || "تنفيذ العملية";

      editBtn.onclick = () => {
        if (editArea.style.display === "none") {
          buildEditArea(editArea, proposal, sourcePrompt, () => {
            card.replaceWith(createActionCard(proposal, sourcePrompt));
          });
          editArea.style.display = "block";
        } else {
          editArea.style.display = "none";
        }
      };

      execBtn.onclick = async () => {
        execBtn.disabled = true;
        editBtn.disabled = true;
        try {
          const endpoint = getWorkerEndpoint();
          const res = await fetch(`${endpoint}/api/execute-proposal`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proposal }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) {
            addNotice(data.error || "تعذر تنفيذ العملية.");
            execBtn.disabled = false;
            editBtn.disabled = false;
            return;
          }
          addNotice("تم تنفيذ العملية وترحيلها بنجاح.");
          execBtn.textContent = "تم التنفيذ";
        } catch (err) {
          addNotice(err.message || "حدث خطأ أثناء التنفيذ.");
          execBtn.disabled = false;
          editBtn.disabled = false;
        }
      };

      actions.appendChild(editBtn);
      actions.appendChild(execBtn);
      card.appendChild(actions);
      card.appendChild(editArea);
      return card;
    }

    function buildSummary(proposal) {
      const ul = document.createElement("ul");
      ul.className = "summary";
      const p = proposal.payload || {};

      const addLine = (label, value) => {
        if (value === undefined || value === null || value === "") return;
        const li = document.createElement("li");
        const b = document.createElement("strong");
        b.textContent = `${label}: `;
        li.appendChild(b);
        li.appendChild(document.createTextNode(String(value)));
        ul.appendChild(li);
      };

      if (proposal.proposal_type === "invoice") {
        addLine("النوع", p.invoice_type === "sale" ? "مبيعات" : "مشتريات");
        addLine("التاريخ", p.invoice_date);
        addLine("المستودع", p.warehouse_code);
        addLine("الطرف", p.party_name);
        addLine("حساب التسوية", p.settlement_account_code);
        addLine("الحساب المقابل", p.offset_account_code);
        addLine("العملة", p.currency);
        if (Array.isArray(p.lines)) {
          let total = 0;
          p.lines.forEach((l, idx) => {
            const qty = Number(l.quantity || 0);
            const prc = Number(l.unit_price ?? l.unit_cost ?? 0);
            total += qty * prc;
            addLine(`السطر ${idx + 1}`, `صنف ${l.item_code} | كمية ${qty} ${l.unit_name || ""} × ${prc} = ${qty * prc}`);
          });
          const net =
            total -
            Number(p.discount_amount || 0) +
            Number(p.tax_amount || 0) +
            Number(p.extra_expenses || 0);
          addLine("الإجمالي", `${net} ${p.currency || ""}`);
        }
      } else if (proposal.proposal_type === "journal_entry") {
        addLine("التاريخ", p.entry_date);
        addLine("البيان", p.description);
        addLine("العملة", p.currency);
        if (Array.isArray(p.lines)) {
          p.lines.forEach((l, idx) => {
            addLine(`سطر ${idx + 1}`, `حساب ${l.account_code} | مدين: ${Number(l.debit || 0)} | دائن: ${Number(l.credit || 0)}`);
          });
        }
      } else if (proposal.proposal_type === "stock_movement") {
        addLine("النوع", p.movement_type === "IN" ? "إدخال" : "إخراج");
        addLine("التاريخ", p.movement_date);
        addLine("المستودع", p.warehouse_code);
        addLine("السبب", p.reason);
        if (Array.isArray(p.lines)) {
          p.lines.forEach((l, idx) => {
            addLine(`سطر ${idx + 1}`, `صنف ${l.item_code} | كمية ${l.quantity} ${l.unit_name || ""}`);
          });
        }
      } else if (proposal.proposal_type === "void_record") {
        addLine("نوع السجل", p.entity_type);
        addLine("رقم السجل", p.record_id);
        addLine("السبب", p.void_reason);
      }

      return ul;
    }

    function buildEditArea(area, proposal, sourcePrompt, onDone) {
      area.innerHTML = "";
      const p = proposal.payload || {};

      const title = document.createElement("div");
      title.className = "card-head";
      title.textContent = "تعديل بيانات العملية";
      area.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      const scalarKeys = Object.keys(p).filter((k) => typeof p[k] !== "object" || p[k] === null);
      const inputs = {};

      scalarKeys.forEach((k) => {
        const wrap = document.createElement("div");
        wrap.className = "field";

        const lbl = document.createElement("label");
        lbl.textContent = k;
        wrap.appendChild(lbl);

        const inp = document.createElement("input");
        inp.type = typeof p[k] === "number" ? "number" : "text";
        if (inp.type === "number") inp.step = "any";
        inp.value = p[k] ?? "";
        inputs[k] = inp;
        wrap.appendChild(inp);
        grid.appendChild(wrap);
      });

      area.appendChild(grid);

      const rephraseWrap = document.createElement("div");
      rephraseWrap.className = "field";
      rephraseWrap.style.marginTop = "10px";

      const rephraseLbl = document.createElement("label");
      rephraseLbl.textContent = "أو اكتب تعديلك بكلمات عادية ليحدّثه المساعد:";
      rephraseWrap.appendChild(rephraseLbl);

      const rephraseInp = document.createElement("input");
      rephraseInp.type = "text";
      rephraseInp.placeholder = "مثال: اجعل المبلغ 75000 أو غيّر الحساب إلى الصندوق";
      rephraseWrap.appendChild(rephraseInp);
      area.appendChild(rephraseWrap);

      const row = document.createElement("div");
      row.className = "actions";

      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "btn-primary";
      saveBtn.textContent = "حفظ التعديلات";
      saveBtn.onclick = () => {
        scalarKeys.forEach((k) => {
          const val = inputs[k].value;
          if (val === "") p[k] = null;
          else if (typeof p[k] === "number") p[k] = Number(val);
          else p[k] = val;
        });
        onDone();
      };

      const aiEditBtn = document.createElement("button");
      aiEditBtn.type = "button";
      aiEditBtn.className = "btn-soft";
      aiEditBtn.textContent = "تعديل عبر المساعد";
      aiEditBtn.onclick = () => {
        const note = rephraseInp.value.trim();
        if (!note) {
          addNotice("اكتب ملاحظة التعديل أولاً.");
          return;
        }
        sendMessage(`تعديل: ${note}`, sourcePrompt);
      };

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "btn-soft";
      cancelBtn.textContent = "إغلاق";
      cancelBtn.onclick = () => {
        area.style.display = "none";
      };

      row.appendChild(saveBtn);
      row.appendChild(aiEditBtn);
      row.appendChild(cancelBtn);
      area.appendChild(row);
    }

    if (workerInput.value.trim()) {
      syncContext();
    }
  </script>
</body>
</html>
