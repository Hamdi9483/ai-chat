<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوكيل الذكي — تصميم المبرمج حمدي إدلبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#0a0a0a;
  --bg2:#121212;
  --bg3:#1c1c1c;
  --hover:#262626;
  --border:#333333;
  --text:#f5f5f5;
  --dim:#9e9e9e;
  --accent:#ffffff;
  --accent2:#d4d4d4;
  --accent-text:#0a0a0a;
  --user:#262626;
  --user-text:#ffffff;
  --bot:#141414;
  --danger:#a3a3a3;
  --shadow:0 4px 24px rgba(0,0,0,.6);
}
body.light{
  --bg:#f4f4f4;
  --bg2:#ffffff;
  --bg3:#eaeaea;
  --hover:#dcdcdc;
  --border:#cccccc;
  --text:#111111;
  --dim:#595959;
  --accent:#111111;
  --accent2:#333333;
  --accent-text:#ffffff;
  --user:#1a1a1a;
  --user-text:#ffffff;
  --bot:#ffffff;
  --danger:#404040;
  --shadow:0 4px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;transition:background .2s,color .2s}
.sidebar{width:260px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s,margin-right .3s;flex-shrink:0}
.sidebar.hidden{margin-right:-260px}
.sidebar-header{padding:16px}
.new-chat-btn{width:100%;padding:12px;background:var(--accent);color:var(--accent-text);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;transition:background .2s}
.new-chat-btn:hover{background:var(--accent2)}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s}
.chat-item:hover{background:var(--hover)}.chat-item.active{background:var(--bg3);border:1px solid var(--border)}
.chat-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.chat-item-del{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;font-family:inherit;font-size:12px}
.chat-item:hover .chat-item-del{opacity:1}.chat-item-del:hover{color:var(--text)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.sidebar-footer button{flex:1;padding:10px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;transition:background .15s}
.sidebar-footer button:hover{background:var(--hover)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;padding:0 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.icon-btn{background:none;border:1px solid transparent;color:var(--text);cursor:pointer;padding:8px 12px;border-radius:8px;font-size:16px;font-family:inherit;transition:background .15s}
.icon-btn:hover{background:var(--hover);border-color:var(--border)}
.model-select{flex:1;max-width:340px;padding:8px 12px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;outline:none}
.messages{flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.message{display:flex;gap:12px;max-width:820px;width:100%;margin:0 auto;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;border:1px solid var(--border)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.message.user .avatar{background:var(--user);color:var(--user-text)}
.message.assistant .avatar{background:var(--bg3);color:var(--text)}
.message-content{flex:1;min-width:0;padding:12px 16px;border-radius:12px;line-height:1.75;font-size:15px;word-wrap:break-word;overflow-wrap:break-word}
.message.user .message-content{background:var(--user);color:var(--user-text);border:1px solid var(--border)}
.message.assistant .message-content{background:var(--bot);border:1px solid var(--border)}
.message-content p{margin:8px 0}.message-content p:first-child{margin-top:0}.message-content p:last-child{margin-bottom:0}
.message-content pre{background:#0d0d0d;border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left;position:relative;color:#e5e5e5}
.message-content code{font-family:'Fira Code',Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.message-content :not(pre)>code{background:rgba(128,128,128,.2);padding:2px 6px;border-radius:4px}
.message-content ul,.message-content ol{padding-right:24px;margin:8px 0}
.message-content a{color:var(--text);text-decoration:underline}
.message-content blockquote{border-right:3px solid var(--dim);padding-right:12px;margin:10px 0;color:var(--dim)}
.code-copy{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;opacity:0;transition:opacity .15s;font-family:inherit}
.message-content pre:hover .code-copy{opacity:1}
.error-banner{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.agent-avatar-large{
  width:110px;height:110px;border-radius:50%;
  background:var(--bg3);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;margin-bottom:18px;overflow:hidden;
  box-shadow:var(--shadow);
  animation:agentFloat 3s ease-in-out infinite;
}
.agent-avatar-large img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%)}
@keyframes agentFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.empty-title{font-size:28px;font-weight:800;margin-bottom:8px;color:var(--text)}
.empty-subtitle{color:var(--dim);font-size:15px;margin-bottom:8px;line-height:1.7;max-width:520px}
.welcome-list{color:var(--dim);font-size:14px;margin:14px 0 28px;text-align:right;max-width:440px;line-height:1.9}
.welcome-list li{list-style:none;padding-right:4px}
.welcome-list li::before{content:'—';color:var(--text);margin-left:8px;font-size:12px}
.agent-signature{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:var(--dim);margin-top:10px;
  padding:6px 14px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--border);
  letter-spacing:.3px;
}
.agent-signature img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--border);filter:grayscale(100%)}
.agent-signature strong{color:var(--text);font-weight:700}
.suggestions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:640px;width:100%}
.suggestion{padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;text-align:right;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s,background .15s}
.suggestion:hover{border-color:var(--text);background:var(--hover)}
.input-area{padding:16px;border-top:1px solid var(--border);background:var(--bg2)}
.input-form{max-width:820px;margin:0 auto;display:flex;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:8px;transition:border-color .15s}
.input-form:focus-within{border-color:var(--text)}
.input-form textarea{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;outline:none;padding:8px;max-height:200px;min-height:24px;line-height:1.5}
.send-btn{background:var(--accent);color:var(--accent-text);border:1px solid var(--border);border-radius:8px;padding:0 16px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:background .15s,opacity .15s;flex-shrink:0}
.send-btn:hover:not(:disabled){background:var(--accent2)}.send-btn:disabled{opacity:.5;cursor:not-allowed}
.footer-note{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}
dialog{border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:16px;padding:24px;max-width:480px;width:calc(100% - 32px);font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:16px;font-size:20px}
.dialog-field{margin-bottom:16px}
.dialog-field label{display:block;margin-bottom:6px;font-size:13px;color:var(--dim)}
.dialog-field input{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;font-family:inherit;font-size:14px;outline:none;direction:ltr;text-align:left}
.dialog-field input:focus{border-color:var(--text)}
.dialog-hint{font-size:12px;color:var(--dim);margin-top:6px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:20px}
.btn{padding:10px 20px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:14px;transition:background .15s}
.btn:hover{background:var(--hover)}.btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}.btn-primary:hover{background:var(--accent2)}

.proposal-card{
  background:var(--bg2);
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-top:12px;
}
.proposal-title{
  font-weight:700;
  color:var(--text);
  margin-bottom:8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}
.proposal-body{
  color:var(--text);
  font-size:13px;
  background:var(--bg3);
  border:1px solid var(--border);
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  line-height:1.7;
}
.proposal-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  padding:4px 0;
  font-size:12px;
}
.proposal-row:last-child{border-bottom:none}
.proposal-fields{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:8px;
  margin-bottom:10px;
}
.proposal-fields input{
  width:100%;
  padding:8px 10px;
  background:var(--bg3);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  font-family:inherit;
  font-size:13px;
}
.proposal-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-approve{
  background:var(--accent);
  color:var(--accent-text);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
  font-family:inherit;
  transition:background .15s;
}
.btn-approve:hover:not(:disabled){background:var(--accent2)}
.btn-approve:disabled{opacity:.5;cursor:not-allowed}
.btn-reject{
  background:var(--bg3);
  color:var(--dim);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  font-family:inherit;
  transition:background .15s,color .15s;
}
.btn-reject:hover{background:var(--hover);color:var(--text)}
.proposal-status{
  color:var(--text);
  font-weight:700;
  font-size:13px;
  padding:10px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:6px;
}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--hover)}
@media (max-width:768px){
  .sidebar{position:fixed;top:0;right:0;bottom:0;z-index:100;box-shadow:var(--shadow)}
  .sidebar.hidden{margin-right:0;transform:translateX(100%)}
  .empty-title{font-size:22px}.messages{padding:16px 12px}
  .agent-avatar-large{width:90px;height:90px}
}
</style>
</head>
<body>

<aside class="sidebar hidden" id="sidebar">
  <div class="sidebar-header">
    <button class="new-chat-btn" id="newChatBtn">+ محادثة جديدة</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <button id="settingsBtn">الإعدادات</button>
    <button id="themeBtn">الوضع الفاتح</button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="toggleSidebar" title="القائمة">القائمة</button>
    <select class="model-select" id="modelSelect"></select>
  </header>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <form class="input-form" id="chatForm">
      <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا... (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
      <button type="submit" class="send-btn" id="sendBtn">إرسال</button>
    </form>
    <div class="footer-note">مدعوم بـ OpenRouter عبر Cloudflare Worker</div>
  </div>
</main>

<dialog id="settingsDialog">
  <h2>الإعدادات</h2>
  <div class="dialog-field">
    <label for="backendUrlInput">رابط الخادم الوسيط (Worker URL)</label>
    <input type="url" id="backendUrlInput" placeholder="https://your-worker.workers.dev">
    <div class="dialog-hint">الصق رابط الـ Worker الذي نشرته على Cloudflare. يبدأ عادةً بـ https://</div>
  </div>
  <div class="dialog-field">
    <label for="companyIdInput">معرّف الشركة (Company UUID)</label>
    <input type="text" id="companyIdInput" placeholder="00000000-0000-0000-0000-000000000000">
    <div class="dialog-hint">معرّف الشركة لعزل البيانات (Multi-tenant RLS)</div>
  </div>
  <div class="dialog-actions">
    <button class="btn btn-primary" id="saveSettings">حفظ</button>
    <button class="btn" id="cancelSettings">إلغاء</button>
  </div>
</dialog>

<script>
const BACKEND_URL = "https://workers-playground-broad-dawn-56ff.accessexpert2020.workers.dev";
const DEFAULT_COMPANY_ID = "00000000-0000-0000-0000-000000000000";

const AGENT_IMAGE = "assets/me.jpeg";
const USER_IMAGE  = "assets/user.png";

const DEFAULT_MODEL = 'openrouter/free';

const state = {
  backendUrl: localStorage.getItem('or_backend_url') || BACKEND_URL,
  companyId: localStorage.getItem('or_company_id') || DEFAULT_COMPANY_ID,
  model: localStorage.getItem('or_model') || DEFAULT_MODEL,
  chats: JSON.parse(localStorage.getItem('or_chats') || '[]'),
  activeChatId: localStorage.getItem('or_active_chat') || null,
  theme: localStorage.getItem('or_theme') || 'dark',
  isGenerating: false,
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const chatListEl = $('chatList');
const inputEl = $('input');
const sendBtn = $('sendBtn');
const modelSelect = $('modelSelect');
const sidebar = $('sidebar');
const settingsDialog = $('settingsDialog');

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function renderMarkdown(text){
  if(typeof marked==='undefined') return escapeHtml(text).replace(/\n/g,'<br>');
  const html=marked.parse(text,{breaks:true,gfm:true});
  return typeof DOMPurify==='undefined'?html:DOMPurify.sanitize(html);
}
function saveState(){
  localStorage.setItem('or_chats',JSON.stringify(state.chats));
  localStorage.setItem('or_active_chat',state.activeChatId||'');
  localStorage.setItem('or_model',state.model);
  localStorage.setItem('or_backend_url',state.backendUrl);
  localStorage.setItem('or_company_id',state.companyId);
  localStorage.setItem('or_theme',state.theme);
}
function getActiveChat(){return state.chats.find(c=>c.id===state.activeChatId)}
function ensureActiveChat(){
  let c=getActiveChat();
  if(!c){c={id:uid(),title:'محادثة جديدة',messages:[],createdAt:Date.now()};state.chats.unshift(c);state.activeChatId=c.id;saveState()}
  return c;
}
function applyTheme(){
  document.body.classList.toggle('light',state.theme==='light');
  $('themeBtn').textContent = state.theme==='light'?'الوضع الداكن':'الوضع الفاتح';
}

async function renderModelSelect() {
  modelSelect.innerHTML = '<option value="openrouter/free">تلقائي (Free Router - موصى به)</option>';
  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', {
      headers: { 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const freeModels = (data.data || []).filter(m => {
      const p = m.pricing || {};
      return String(p.prompt) === '0' && String(p.completion) === '0';
    });
    for (const m of freeModels) {
      if (m.id === 'openrouter/free') continue;
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name || m.id;
      modelSelect.appendChild(opt);
    }
  } catch (e) {
    console.warn('تعذر تحميل قائمة النماذج المجانية، سيتم استخدام openrouter/free فقط.', e);
  }
  if (modelSelect.querySelector(`option[value="${CSS.escape(state.model)}"]`)) {
    modelSelect.value = state.model;
  } else {
    modelSelect.value = 'openrouter/free';
    state.model = 'openrouter/free';
    saveState();
  }
}

function renderChatList(){
  chatListEl.innerHTML='';
  if(!state.chats.length){
    chatListEl.innerHTML='<div style="padding:16px;color:var(--dim);font-size:13px;text-align:center">لا توجد محادثات</div>';
    return;
  }
  for(const chat of state.chats){
    const item=document.createElement('div');
    item.className='chat-item'+(chat.id===state.activeChatId?' active':'');
    item.innerHTML=`<span class="chat-item-title">${escapeHtml(chat.title||'محادثة')}</span><button class="chat-item-del" title="حذف">حذف</button>`;
    item.querySelector('.chat-item-title').addEventListener('click',()=>switchChat(chat.id));
    item.querySelector('.chat-item-del').addEventListener('click',(e)=>{e.stopPropagation();deleteChat(chat.id)});
    chatListEl.appendChild(item);
  }
}

function createMessageEl(role){
  const d=document.createElement('div');
  d.className='message '+role;
  const isUser = role === 'user';
  const src = isUser ? USER_IMAGE : AGENT_IMAGE;
  const fallback = isUser ? 'أنت' : 'AI';
  d.innerHTML = `
    <div class="avatar">
      <img src="${src}" alt="${isUser?'المستخدم':'الوكيل الذكي'}"
           onerror="this.style.display='none';this.parentElement.textContent='${fallback}'">
    </div>
    <div class="message-content"></div>`;
  return d;
}

function postProcessCode(container){
  container.querySelectorAll('pre').forEach(pre=>{
    if(pre.querySelector('.code-copy')) return;
    const btn=document.createElement('button');
    btn.className='code-copy';btn.textContent='نسخ';
    btn.addEventListener('click',()=>{
      const code=pre.querySelector('code')?.innerText||pre.innerText;
      navigator.clipboard.writeText(code).then(()=>{btn.textContent='تم النسخ';setTimeout(()=>btn.textContent='نسخ',1500)});
    });
    pre.appendChild(btn);
  });
  container.querySelectorAll('pre code').forEach(b=>{try{hljs.highlightElement(b)}catch(e){}});
}

function renderProposalCard(assistantContentElement, proposal, sourcePrompt){
  if (!proposal || typeof proposal !== 'object') return;

  const proposalBox = document.createElement('div');
  proposalBox.className = 'proposal-card';

  if (proposal.proposal_type === 'missing_info') {
    const fields = Array.isArray(proposal.missing_fields) && proposal.missing_fields.length
      ? proposal.missing_fields
      : [{ key: 'details', label: 'البيانات المطلوبة', type: 'text' }];

    proposalBox.innerHTML = `
      <div class="proposal-title">إكمال البيانات المطلوبة</div>
      <div class="proposal-body">${escapeHtml(proposal.question || 'يرجى تزويدي بالبيانات الناقصة لإتمام العملية.')}</div>
      <div class="proposal-fields">
        ${fields.map((f, i) => `
          <input
            type="${f.type === 'number' ? 'number' : 'text'}"
            step="any"
            data-key="${escapeHtml(f.key || 'field_' + i)}"
            data-label="${escapeHtml(f.label || f.key || 'بيان')}"
            placeholder="${escapeHtml(f.label || f.key || 'أدخل القيمة')}"
          />
        `).join('')}
      </div>
      <div class="proposal-actions">
        <button type="button" class="btn-approve" id="submit-missing-btn">إرسال البيانات</button>
        <button type="button" class="btn-reject" id="reject-btn">إلغاء</button>
      </div>
    `;

    proposalBox.querySelector('#submit-missing-btn').addEventListener('click', () => {
      const inputs = Array.from(proposalBox.querySelectorAll('.proposal-fields input'));
      const parts = inputs
        .map(inp => {
          const val = inp.value.trim();
          return val ? `${inp.dataset.label}: ${val}` : '';
        })
        .filter(Boolean);
      if (!parts.length) return;
      handleSend(`${sourcePrompt}\n${parts.join(' ، ')}`);
    });

    proposalBox.querySelector('#reject-btn').addEventListener('click', () => {
      proposalBox.innerHTML = `<div class="proposal-status" style="color:var(--dim);font-weight:400;">تم إلغاء الطلب.</div>`;
    });

    assistantContentElement.appendChild(proposalBox);
    return;
  }

  const p = proposal.payload || {};
  let rowsHtml = '';

  if (proposal.proposal_type === 'journal_entry') {
    rowsHtml = `
      <div><strong>البيان:</strong> ${escapeHtml(p.description || proposal.title || '')}</div>
      <div><strong>التاريخ:</strong> ${escapeHtml(p.entry_date || '')} | <strong>العملة:</strong> ${escapeHtml(p.currency || '')}</div>
      ${(p.lines || []).map(l => `
        <div class="proposal-row">
          <span>حساب: ${escapeHtml(l.account_code)} ${l.notes ? '| ' + escapeHtml(l.notes) : ''}</span>
          <span>مدين: ${l.debit || 0} | دائن: ${l.credit || 0}</span>
        </div>
      `).join('')}
    `;
  } else if (proposal.proposal_type === 'stock_movement') {
    const typeLabel = p.movement_type === 'IN' ? 'إدخال' : 'إخراج';
    rowsHtml = `
      <div><strong>النوع:</strong> ${typeLabel} | <strong>المستودع:</strong> ${escapeHtml(p.warehouse_code || '')}</div>
      <div><strong>التاريخ:</strong> ${escapeHtml(p.movement_date || '')} | <strong>السبب:</strong> ${escapeHtml(p.reason || '')}</div>
      ${(p.lines || []).map(l => `
        <div class="proposal-row">
          <span>صنف: ${escapeHtml(l.item_code)} | وحدة: ${escapeHtml(l.unit_name || '')}</span>
          <span>الكمية: ${l.quantity || 0}</span>
        </div>
      `).join('')}
    `;
  } else if (proposal.proposal_type === 'invoice') {
    const invTypeLabel = p.invoice_type === 'sale' ? 'بيع' : 'شراء';
    rowsHtml = `
      <div><strong>النوع:</strong> فاتورة ${invTypeLabel} | <strong>المستودع:</strong> ${escapeHtml(p.warehouse_code || '')}</div>
      <div><strong>التاريخ:</strong> ${escapeHtml(p.invoice_date || '')} | <strong>العملة:</strong> ${escapeHtml(p.currency || '')}</div>
      ${p.party_name ? `<div><strong>الطرف:</strong> ${escapeHtml(p.party_name)}</div>` : ''}
      ${(p.lines || []).map(l => `
        <div class="proposal-row">
          <span>صنف: ${escapeHtml(l.item_code)} | وحدة: ${escapeHtml(l.unit_name || '')}</span>
          <span>كمية: ${l.quantity || 0} × ${l.unit_price ?? l.unit_cost ?? 0}</span>
        </div>
      `).join('')}
    `;
  } else if (proposal.proposal_type === 'void_record') {
    rowsHtml = `
      <div><strong>نوع السجل:</strong> ${escapeHtml(p.entity_type || '')}</div>
      <div><strong>رقم السجل:</strong> ${escapeHtml(String(p.record_id || ''))}</div>
      <div><strong>السبب:</strong> ${escapeHtml(p.void_reason || '')}</div>
    `;
  } else if (proposal.proposal_type === 'create_account' || proposal.proposal_type === 'update_account') {
    const isUpdate = proposal.proposal_type === 'update_account';
    rowsHtml = `
      <div><strong>رمز الحساب:</strong> ${escapeHtml(p.code || '')}</div>
      <div><strong>الاسم ${isUpdate ? 'الجديد' : ''}:</strong> ${escapeHtml(p.name || '')}</div>
      <div><strong>النوع:</strong> ${escapeHtml(p.type || '')} | <strong>الطبيعة:</strong> ${escapeHtml(p.normal || '')}</div>
      ${p.description ? `<div><strong>الوصف:</strong> ${escapeHtml(p.description)}</div>` : ''}
    `;
  } else if (proposal.proposal_type === 'create_warehouse' || proposal.proposal_type === 'update_warehouse') {
    const isUpdate = proposal.proposal_type === 'update_warehouse';
    rowsHtml = `
      <div><strong>رمز المستودع:</strong> ${escapeHtml(p.code || '')}</div>
      <div><strong>الاسم ${isUpdate ? 'الجديد' : ''}:</strong> ${escapeHtml(p.name || '')}</div>
      ${p.inventory_account_code ? `<div><strong>حساب المخزون:</strong> ${escapeHtml(p.inventory_account_code)}</div>` : ''}
    `;

  } else if (proposal.proposal_type === 'update_item') {
    rowsHtml = `
      <div><strong>رمز المادة:</strong> ${escapeHtml(p.code || '')}</div>
      <div><strong>الاسم الجديد:</strong> ${escapeHtml(p.name || '')}</div>
      <div><strong>الوحدة الأساسية:</strong> ${escapeHtml(p.base_unit || '')}</div>
    `;
  } else if (proposal.proposal_type === 'create_item' || proposal.proposal_type === 'update_item_units') {
    const units = Array.isArray(p.units) ? p.units : [];
    const unitsTableHtml = units.length > 0 ? `
      <div style="margin-top:10px">
        <strong style="display:block;margin-bottom:6px;font-size:13px">الوحدات (${units.length}):</strong>
        <table style="width:100%;border-collapse:collapse;font-size:12px;background:var(--bg2);border-radius:6px;overflow:hidden">
          <thead>
            <tr style="background:var(--bg3);border-bottom:1px solid var(--border)">
              <th style="padding:8px;text-align:right;font-weight:700">اسم الوحدة</th>
              <th style="padding:8px;text-align:right;font-weight:700">الباركود</th>
              <th style="padding:8px;text-align:center;font-weight:700">معامل التحويل</th>
              <th style="padding:8px;text-align:center;font-weight:700">أساسية</th>
            </tr>
          </thead>
          <tbody>
            ${units.map(u => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:8px">${escapeHtml(u.unit_name || '')}</td>
                <td style="padding:8px;font-family:monospace;font-size:11px;color:var(--dim)">${escapeHtml(u.barcode || '—')}</td>
                <td style="padding:8px;text-align:center">${u.conversion_factor || 1}</td>
                <td style="padding:8px;text-align:center">${u.is_base_unit ? '✓' : ''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : '';
    rowsHtml = `
      <div><strong>رمز المادة:</strong> ${escapeHtml(p.code || p.item_code || '')}</div>
      ${p.name ? `<div><strong>الاسم:</strong> ${escapeHtml(p.name)}</div>` : ''}
      ${p.base_unit ? `<div><strong>الوحدة الأساسية:</strong> ${escapeHtml(p.base_unit)}</div>` : ''}
      ${unitsTableHtml}
    `;
  } else {
    return;
  }
    

  proposalBox.innerHTML = `
    <div class="proposal-title">${escapeHtml(proposal.title || 'مقترح عملية جاهز للتنفيذ')}</div>
    <div class="proposal-body">${rowsHtml}</div>
    <div class="proposal-actions">
      <button type="button" class="btn-approve" id="approve-btn">${escapeHtml(proposal.button_label || 'اعتماد وتنفيذ')}</button>
      <button type="button" class="btn-reject" id="reject-btn">رفض</button>
    </div>
  `;

  proposalBox.querySelector('#approve-btn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = 'جارٍ التنفيذ...';
    try {
      const baseUrl = state.backendUrl.replace(/\/+$/, '');
      const res = await fetch(`${baseUrl}/api/execute-proposal`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposal })
      });
      const result = await res.json().catch(() => ({}));
      if (res.ok && result.ok) {
        proposalBox.innerHTML = `<div class="proposal-status">تم تنفيذ العملية وترحيلها بنجاح.</div>`;
      } else {
        throw new Error(result.error || 'فشل تنفيذ العملية');
      }
    } catch (err) {
      proposalBox.innerHTML = `<div class="proposal-status">خطأ في التنفيذ: ${escapeHtml(err.message)}</div>`;
    }
  });

  proposalBox.querySelector('#reject-btn').addEventListener('click', () => {
    proposalBox.innerHTML = `<div class="proposal-status" style="color:var(--dim);font-weight:400;">تم رفض وإلغاء هذا المقترح.</div>`;
  });

  assistantContentElement.appendChild(proposalBox);
}

function renderMessages(){
  messagesEl.innerHTML='';
  const chat=getActiveChat();
  if(!chat||!chat.messages.length){renderEmptyState();return}
  for(const msg of chat.messages){
    const el=createMessageEl(msg.role);
    const content=el.querySelector('.message-content');
    if(msg.role==='assistant'){
      content.innerHTML=renderMarkdown(msg.content||'');
      if(msg.proposal) renderProposalCard(content, msg.proposal, msg.sourcePrompt || '');
      postProcessCode(content);
    }
    else {
      content.textContent=msg.content;
    }
    messagesEl.appendChild(el);
  }
  scrollToBottom();
}

function renderEmptyState(){
  messagesEl.innerHTML=`<div class="empty-state">
    <div class="agent-avatar-large">
      <img src="${AGENT_IMAGE}" alt="الوكيل الذكي"
           onerror="this.style.display='none';this.parentElement.textContent='AI'">
    </div>
    <div class="empty-title">أهلاً بك في الوكيل الذكي</div>
    <div class="empty-subtitle">مساعدك المحاسبي ونظام الـ ERP المتكامل — مبني على القيد المزدوج والجرد المستمر</div>
    <ul class="welcome-list">
      <li>دعم كامل للمخطط المحاسبي الاحترافي وعزل الشركات (Multi-tenant)</li>
      <li>تعريف وتعديل المواد، الحسابات الشجرية، المستودعات، والشركاء</li>
      <li>حماية صارمة للبيانات المالية بدقة numeric(18,4) ومنع التكرار</li>
    </ul>
    <div class="agent-signature">
      <img src="${AGENT_IMAGE}" alt=""
           onerror="this.style.display='none'">
      تصميم المبرمج <strong>حمدي إدلبي</strong>
    </div>
    <div class="suggestions" style="margin-top:28px">
      <button class="suggestion" data-prompt="سددنا 50000 من الصندوق لحساب الموردين">سداد لمورد من الصندوق</button>
      <button class="suggestion" data-prompt="اشترينا 20 قطعة من المستودع الرئيسي">مثال فاتورة مشتريات</button>
      <button class="suggestion" data-prompt="إخراج مخزني لـ 5 قطع من المستودع الرئيسي">مثال إخراج مخزني</button>
      <button class="suggestion" data-prompt="ما هي المستودعات والحسابات المتاحة حالياً؟">عرض المستودعات والحسابات</button>
    </div></div>`;
  messagesEl.querySelectorAll('.suggestion').forEach(b=>{
    b.addEventListener('click',()=>{handleSend(b.dataset.prompt)});
  });
}

function scrollToBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}
function newChat(){
  const chat={id:uid(),title:'محادثة جديدة',messages:[],createdAt:Date.now()};
  state.chats.unshift(chat);state.activeChatId=chat.id;saveState();
  renderChatList();renderMessages();
  if(window.innerWidth<=768) sidebar.classList.add('hidden');
  inputEl.focus();
}
function switchChat(id){
  state.activeChatId=id;saveState();renderChatList();renderMessages();
  if(window.innerWidth<=768) sidebar.classList.add('hidden');
}
function deleteChat(id){
  if(!confirm('حذف هذه المحادثة؟')) return;
  state.chats=state.chats.filter(c=>c.id!==id);
  if(state.activeChatId===id) state.activeChatId=state.chats[0]?.id||null;
  saveState();renderChatList();renderMessages();
}

async function handleSend(overrideText = ''){
  const text=(typeof overrideText === 'string' && overrideText.trim()) ? overrideText.trim() : inputEl.value.trim();
  if(!text||state.isGenerating) return;
  if(!state.backendUrl){openSettings();return}

  const chat=ensureActiveChat();
  if(!overrideText){
    inputEl.value='';
    autoResize();
  }
  state.isGenerating=true;sendBtn.disabled=true;

  chat.messages.push({role:'user',content:text});
  if(chat.messages.length===1) chat.title=text.slice(0,40)+(text.length>40?'…':'');
  saveState();

  renderMessages();

  const assistantEl=createMessageEl('assistant');
  const assistantContent=assistantEl.querySelector('.message-content');
  assistantContent.textContent='جارٍ التحليل وتجهيز الرد...';
  messagesEl.appendChild(assistantEl);
  scrollToBottom();

  try{
    const baseUrl = state.backendUrl.replace(/\/+$/, '');
    const response=await fetch(`${baseUrl}/api/interpret`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        prompt: text,
        company_id: state.companyId,
        model: state.model
      }),
    });

    const data=await response.json().catch(()=>({}));
    if(!response.ok || !data.ok){
      throw new Error(data.error || `HTTP ${response.status}`);
    }

    const replyText = data.reply || 'تم تحليل الطلب.';
    assistantContent.innerHTML = renderMarkdown(replyText);
    if (data.proposal) {
      renderProposalCard(assistantContent, data.proposal, text);
    }
    postProcessCode(assistantContent);

    chat.messages.push({
      role:'assistant',
      content:replyText,
      proposal:data.proposal || null,
      sourcePrompt:text
    });
    saveState();
    renderChatList();

  }catch(err){
    assistantContent.innerHTML='';
    const b=document.createElement('div');
    b.className='error-banner';
    b.textContent='خطأ: '+err.message;
    assistantContent.appendChild(b);
  }finally{
    state.isGenerating=false;sendBtn.disabled=false;inputEl.focus();scrollToBottom();
  }
}

function openSettings(){
  $('backendUrlInput').value=state.backendUrl;
  $('companyIdInput').value=state.companyId;
  settingsDialog.showModal();
}
function saveSettings(){
  let url=$('backendUrlInput').value.trim();
  if(url && !url.startsWith('http')) url='https://'+url;
  const cid=$('companyIdInput').value.trim() || DEFAULT_COMPANY_ID;
  state.backendUrl=url;
  state.companyId=cid;
  saveState();
  settingsDialog.close();
  if(state.backendUrl && getActiveChat()?.messages.length===0) renderMessages();
}
function autoResize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,200)+'px'}

async function init(){
  applyTheme();
  await renderModelSelect();
  renderChatList();
  if(!state.activeChatId && state.chats.length) state.activeChatId=state.chats[0].id;
  renderMessages();

  $('newChatBtn').addEventListener('click',newChat);
  $('settingsBtn').addEventListener('click',openSettings);
  $('saveSettings').addEventListener('click',saveSettings);
  $('cancelSettings').addEventListener('click',()=>settingsDialog.close());
  $('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme();saveState()});
  $('toggleSidebar').addEventListener('click',()=>sidebar.classList.toggle('hidden'));
  modelSelect.addEventListener('change',()=>{state.model=modelSelect.value;saveState()});
  $('chatForm').addEventListener('submit',(e)=>{e.preventDefault();handleSend()});
  inputEl.addEventListener('input',autoResize);
  inputEl.addEventListener('keydown',(e)=>{
    if(e.key==='Enter' && !e.shiftKey){e.preventDefault();handleSend()}
  });

  if(window.innerWidth>768) sidebar.classList.remove('hidden');
  if(!state.backendUrl) setTimeout(openSettings,400);
  inputEl.focus();
}
init();
</script>
</body>
</html>
